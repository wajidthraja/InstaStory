name: Build APK

# Runs on every push to main, or manually from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK on the Releases page

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build installable APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PfacebookAppId="${{ secrets.FACEBOOK_APP_ID }}"
          cp app/build/outputs/apk/release/app-release.apk StoryMaker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StoryMaker-apk
          path: StoryMaker.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: "Built from ${{ github.sha }}. Open this page on your phone and tap StoryMaker.apk to install."
          files: StoryMaker.apk
          prerelease: true
          make_latest: true
