name: Build APK

# Runs on every push to main, or manually from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK on the Releases page

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build installable APK
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleRelease --console=plain -PfacebookAppId="${{ secrets.FACEBOOK_APP_ID }}" 2>&1 | tee build.log; then
            # Surface the real errors as annotations so they show on the run page (and via the API).
            grep -E '^e: ' build.log | head -8 | while IFS= read -r line; do echo "::error title=Kotlin::${line}"; done
            awk '/What went wrong:/{f=1} /Try:/{f=0} f' build.log | head -25 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' | sed 's/^/::error title=Gradle::/'
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk StoryMaker.apk

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: StoryMaker-apk
          path: StoryMaker.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: "Built from ${{ github.sha }}. Open this page on your phone and tap StoryMaker.apk to install."
          files: StoryMaker.apk
          prerelease: true
          make_latest: true
